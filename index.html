
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Finance Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 20px;
    }
    .card {
      max-width: 400px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px #ddd;
    }
    h1 { color: #1d4ed8; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #result {
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Finance Calculator</h1>
    <h2>GST Calculator</h2>

    <label for="amount">Amount (INR)</label>
    <input id="amount" type="number"
           min="0" step="0.01"
           placeholder="Enter amount">

    <label for="gst">GST Rate</label>
    <select id="gst">
      <option value="5">5%</option>
      <option value="12">12%</option>
      <option value="18">18%</option>
      <option value="28">28%</option>
    </select>

    <button onclick="calculateGST()">
      Calculate GST
    </button>

    <p id="result" aria-live="polite"></p>
  </main>

  <script>
    function calculateGST() {
      const amountText =
        document.getElementById("amount").value;
      const amount = Number(amountText);
      const rate =
        Number(document.getElementById("gst").value);
      const result =
        document.getElementById("result");

      if (amountText.trim() === "" ||
          !Number.isFinite(amount) || amount < 0) {
        result.textContent =
          "Please enter a valid amount.";
        return;
      }

      const tax = amount * rate / 100;
      const total = amount + tax;
      const format = value =>
        value.toLocaleString("en-IN", {
          style: "currency",
          currency: "INR"
        });

      result.textContent =
        "GST: " + format(tax) +
        " | Total: " + format(total);
    }
  </script>
</body>
</html>
